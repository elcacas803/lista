// ───── [NUEVO] 💳 tarjeta de cliente: con el número, los datos los completa el negocio ─────
function tarOk(t) {
  t = String(t || '').toUpperCase().replace(/[\s-]/g, '');
  if (/^\d{7}$/.test(t)) t = 'CL' + t;
  if (!/^CL\d{7}$/.test(t)) return '';
  let s = 0; for (let i = 0; i < 6; i++) s += (+t[2 + i]) * (i % 2 ? 3 : 1);
  return String((10 - s % 10) % 10) === t[8] ? t : '';
}
function tarCambio() {
  const el = $('fTar'); if (!el) return;
  const v = el.value.trim(), ok = tarOk(v);
  $('fDatos').style.display = ok ? 'none' : '';
  $('tarMsg').className = 'tarm' + (ok ? ' si' : v ? ' no' : '');
  $('tarMsg').textContent = ok ? '✅ Tarjeta ' + ok + ': tus datos los completamos nosotros.' :
    v ? (v.replace(/\W/g, '').length >= 7 ? '❌ Ese número no es válido: revisalo (o escaneala).' : 'Seguí escribiendo…') : 'Si no la tenés, completá tus datos abajo.';
}

  document.body.appendChild(d);

  try { scan.st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false }); }
  catch (e) { scanCerrar(); alert('No se pudo abrir la cámara: dale permiso o escribí el número.'); return; }
  if (!scan || !scan.on) { scan && scan.st && scan.st.getTracks().forEach(t => t.stop()); return; }
  const v = $('scV'); v.srcObject = scan.st; try { await v.play(); } catch (e) { /* iPhone */ }
  let det = null;
  try { if ('BarcodeDetector' in window && (await BarcodeDetector.getSupportedFormats()).includes('code_128')) det = new BarcodeDetector({ formats: ['code_128'] }); } catch (e) { det = null; }
  const cv = document.createElement('canvas');

  while (scan && scan.on) {
    let t = '';
    if (v.readyState >= 2) {
      if (det) { try { const r = await det.detect(v); const x = r.map(z => tarOk(z.rawValue)).find(Boolean); if (x) t = x; } catch (e) { det = null; } }
      if (!t && !det) {

        const r = img ? ses.foto(img.g, img.w, img.h, 80) : null;
        if (r) t = tarOk(r.texto);

    if (t) { scanCerrar(); try { navigator.vibrate && navigator.vibrate(60); } catch (e) { } $('fTar').value = t; tarCambio(); return; }

function scanCerrar() {

  scan = null; const d = $('scan'); if (d) d.remove();
}
