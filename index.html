function entTipo(t) { datosCli(); ent.tipo = t; entGuardar(); abrir(); }

function envDest() {

}
function envAhora() { const c = cuenta(), d = envDest(); return { c, d, e: D.envio && d ? envCalc(D.envio, c.nivel, c.total, d) : null }; }

function envCodigo() {

function cerrar() { $('capa').style.display = 'none'; }

async function copiar() {
